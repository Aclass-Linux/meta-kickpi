#@TYPE: Machine
#@NAME: KICKPI K7 (RK3576), Rockchip boot chain (bring-up)
require conf/machine/include/arm/armv8a/tune-cortexa72-cortexa53.inc

MACHINE_FEATURES = "usbhost usbgadget ext2"
MACHINE_EXTRA_RRECOMMENDS += "kernel-modules"
K7_CONSOLE_DEVICE = "ttyS0"
K7_CONSOLE_BAUD = "1500000"
SERIAL_CONSOLES = "${K7_CONSOLE_BAUD};${K7_CONSOLE_DEVICE}"

PREFERRED_PROVIDER_virtual/kernel = "linux-k7-rockchip"
KERNEL_IMAGETYPE = "Image"
KERNEL_DEVICETREE = "rockchip/rk3576-kickpi-k7.dtb"

# 启动方案只选择 U-Boot/SPL，Linux 仍使用上述厂商内核。
# 在 local.conf 中设置 K7_BOOT_STACK = "mainline" 可切换到上游源码方案。
K7_BOOT_STACK ?= "oe"
K7_BOOT_PROVIDER = "${@{'rockchip': 'u-boot-k7-rockchip', 'mainline': 'u-boot-k7-mainline', 'oe': 'u-boot', 'jeffy': 'u-boot-rockchip'}.get(d.getVar('K7_BOOT_STACK')) or bb.fatal('K7_BOOT_STACK 只允许 rockchip、mainline、oe 或 jeffy')}"
PREFERRED_PROVIDER_virtual/bootloader = "${K7_BOOT_PROVIDER}"
# 各方案使用不同部署名称，防止切换时误用另一方案的旧产物。
K7_BOOT_PREFIX = "k7-${K7_BOOT_STACK}"

# K7 的默认 defconfig；两条上游路线在共用配方片段中覆盖它。
UBOOT_MACHINE = "rk3576_defconfig"
# K7 使用 FIT 作为启动主产物，不单独部署初始环境文件。
UBOOT_BINARY = "u-boot.itb"
UBOOT_INITIAL_ENV = ""

# 磁盘布局契约（唯一定义处）：WIC 分区偏移与两套 U-Boot 方案的
# 尺寸校验共用。IDB 从 32 KiB 起，FIT 从 8 MiB 起，rootfs 从 16 MiB 起。
K7_LOADER_OFFSET_KIB = "32"
K7_FIT_OFFSET_KIB = "8192"
K7_ROOT_ALIGNMENT_KIB = "16384"
# 由偏移推导的产物尺寸上限（字节），U-Boot 配方 do_compile 校验引用；
# 配置层用 Python 表达式计算，shell 任务不支持 $(( )) 算术展开。
K7_IDB_MAX_BYTES = "${@int(d.getVar('K7_FIT_OFFSET_KIB')) * 1024 - int(d.getVar('K7_LOADER_OFFSET_KIB')) * 1024}"
K7_FIT_MAX_BYTES = "${@int(d.getVar('K7_ROOT_ALIGNMENT_KIB')) * 1024 - int(d.getVar('K7_FIT_OFFSET_KIB')) * 1024}"
