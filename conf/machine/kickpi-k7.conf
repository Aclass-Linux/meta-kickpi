#@TYPE: Machine
#@NAME: KICKPI K7 (RK3576), Rockchip boot chain (bring-up)
require conf/machine/include/arm/armv8a/tune-cortexa72-cortexa53.inc

MACHINE_FEATURES = "usbhost usbgadget ext2"
MACHINE_EXTRA_RRECOMMENDS += "kernel-modules"
K7_CONSOLE_DEVICE = "ttyS0"
K7_CONSOLE_BAUD = "1500000"
SERIAL_CONSOLES = "${K7_CONSOLE_BAUD};${K7_CONSOLE_DEVICE}"

PREFERRED_PROVIDER_virtual/kernel = "linux-k7-rockchip"
KERNEL_IMAGETYPE = "Image"
KERNEL_DEVICETREE = "rockchip/rk3576-kickpi-k7.dtb"

PREFERRED_PROVIDER_virtual/bootloader = "u-boot-k7-rockchip"
UBOOT_MACHINE = "rk3576_defconfig"
UBOOT_BINARY = "u-boot.itb"
UBOOT_INITIAL_ENV = ""
