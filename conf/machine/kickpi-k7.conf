#@TYPE: Machine
#@NAME: KICKPI K7 (RK3576), upstream serial/MMC bring-up
require conf/machine/include/arm/armv8a/tune-cortexa72-cortexa53.inc

MACHINE_FEATURES = "usbhost usbgadget ext2"
MACHINE_EXTRA_RRECOMMENDS += "kernel-modules"
K7_CONSOLE_DEVICE = "ttyS0"
K7_CONSOLE_BAUD = "1500000"
SERIAL_CONSOLES = "${K7_CONSOLE_BAUD};${K7_CONSOLE_DEVICE}"

PREFERRED_PROVIDER_virtual/kernel = "linux-yocto"
PREFERRED_VERSION_linux-yocto = "6.18%"
KERNEL_IMAGETYPE = "Image"
KERNEL_DEVICETREE = "rockchip/rk3576-kickpi-k7.dtb"

PREFERRED_PROVIDER_virtual/bootloader = "u-boot-k7-mainline"
PREFERRED_VERSION_u-boot-k7-mainline = "2026.10"
UBOOT_MACHINE = "kickpi-k7-rk3576_defconfig"
UBOOT_BINARY = "u-boot-rockchip.bin"
UBOOT_INITIAL_ENV = ""
