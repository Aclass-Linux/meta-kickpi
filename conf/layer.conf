# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# 收录 BSP 配方，JeffyCN 扩展由下方动态规则收录。
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb"

BBFILE_COLLECTIONS += "kickpi"
BBFILE_PATTERN_kickpi = "^${LAYERDIR}/recipes-"
BBFILE_PRIORITY_kickpi = "6"

LAYERDEPENDS_kickpi = "core"
LAYERSERIES_COMPAT_kickpi = "scarthgap"

# Scarthgap unpacks local recipe inputs directly into WORKDIR.
UNPACKDIR ??= "${WORKDIR}"

# BBFILES_DYNAMIC 使用 collection:文件路径，仅在对应 collection 启用时扫描。
# JeffyCN 和社区层都叫 rockchip。先从已启用的层查找 JeffyCN 的基础配方，
# 避免只启用社区层时出现找不到基础配方的 bbappend。
K7_JEFFY_BASE_RECIPE = "${@bb.utils.which(':'.join(d.getVar('BBLAYERS').split()), 'recipes-bsp/u-boot/u-boot-rockchip.bb') or ''}"
K7_JEFFY_APPEND := "${LAYERDIR}/recipes-bsp/u-boot/u-boot-rockchip.bbappend"
BBFILES_DYNAMIC += "${@'rockchip:' + d.getVar('K7_JEFFY_APPEND') if d.getVar('K7_JEFFY_BASE_RECIPE') else ''}"
